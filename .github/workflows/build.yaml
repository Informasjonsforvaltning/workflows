name: Reusable build

on:
  workflow_call:
    inputs:
      build_context:
        required: false
        type: string
        default: ./
      build_env:
        required: false
        type: boolean
      build_env_name:
        required: false
        type: string
      build_env_value:
        required: false
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      dockerfile_context:
        required: false
        type: string
        default: ./
      java_version:
        required: false
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup java jdk if java/kotlin
        if: ${{ inputs.java_version != '' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "zulu"
          java-version: ${{ inputs.java_version }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Package & run tests if maven
        if: ${{ inputs.java_version != '' }}
        run: mvn clean install --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: ${{ !inputs.build_env }}
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.build_context }}${{ inputs.dockerfile }}
          push: false
          tags: "test_build"
          labels: "test_build"
          cache-from: type=gha
          cache-to: type=gha, mode=max
          provenance: false
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Build (with build env)
        if: ${{ inputs.build_env }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.build_context }}${{ inputs.dockerfile }}
          push: false
          tags: "test_build"
          labels: "test_build"
          cache-from: type=gha
          cache-to: type=gha, mode=max
          provenance: false
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            ${{ inputs.build_env_name }}=${{ inputs.build_env_value }}
