version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Sub-actions share a commit SHA; init/autobuild/analyze must
      # be bumped together or CodeQL fails on a version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
