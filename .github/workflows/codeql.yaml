name: Reusable CodeQl analysis

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      java_version:
        required: false
        type: string
        default: "17"
      go_version:
        required: false
        type: string
        default: "1.20"
      python_version:
        required: false
        type: string
        default: "3.10"
      python_architecture:
        required: false
        type: string
        default: x64
      working_directory:
        required: false
        type: string
        default: ./
    secrets:
      GH_TOKEN:
        required: true

jobs:
  codeql-scan:
    name: Analyze source code
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ inputs.python_version }}
          architecture: ${{ inputs.python_architecture }}

      - name: Set up Java
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "zulu"
          java-version: ${{ inputs.java_version }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Set up Go
        if: ${{ inputs.language == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ inputs.language }}, actions

      - name: Autobuild if compiled language
        if: ${{ inputs.language == 'java' || inputs.language == 'go'}}
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          working-directory: ${{ inputs.working_directory }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
