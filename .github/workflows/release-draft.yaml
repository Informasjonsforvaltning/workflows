name: Release Drafter
on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

jobs:
  draft_release:
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ secrets.GH_TOKEN }}
