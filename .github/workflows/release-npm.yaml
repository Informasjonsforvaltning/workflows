name: Publish to npm
on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '22.22.1'
      version_bump:
        description: 'patch | minor | major'
        required: false
        type: string
        default: patch
      package_manager:
        description: 'yarn | npm'
        required: false
        type: string
        default: yarn
      test_command:
        description: 'Command to run tests. When empty, yarn projects auto-detect a "test" script.'
        required: false
        type: string
      extra_setup_command:
        description: 'Optional command run after install, before tests (e.g. "yarn playwright install --with-deps").'
        required: false
        type: string
      run_install_scripts:
        description: 'Run dependency lifecycle scripts (postinstall etc.) during install. Off by default so third-party code cannot reach the OIDC identity or the bot token.'
        required: false
        type: boolean
        default: false
    secrets:
      BOT_ACCESS_TOKEN:
        required: true

jobs:
  release:
    if: github.actor != 'fdk-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          # Do not leave the bot token on disk for later steps (install scripts,
          # build, tests). It is injected only in the final push step.
          persist-credentials: false

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node.js
        # No registry-url: publishing uses OIDC trusted publishing, which npm
        # resolves at publish time without an .npmrc auth entry. Leaving it out
        # also avoids the ${NODE_AUTH_TOKEN} placeholder that Yarn 1 rejects.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm i -g npm@11.19.1

      - name: Install dependencies
        run: |
          run_scripts="${{ inputs.run_install_scripts }}"
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            flags=""
            [ "$run_scripts" = "true" ] || flags="--ignore-scripts"
            npm ci $flags
          elif [ "$(yarn --version | cut -d. -f1)" = "1" ]; then
            flags=""
            [ "$run_scripts" = "true" ] || flags="--ignore-scripts"
            yarn install --frozen-lockfile $flags
          else
            flags=""
            [ "$run_scripts" = "true" ] || flags="--mode=skip-build"
            yarn install --immutable $flags
          fi

      - name: Extra setup
        if: ${{ inputs.extra_setup_command != '' }}
        run: ${{ inputs.extra_setup_command }}

      - name: Run tests
        if: ${{ inputs.test_command != '' }}
        run: ${{ inputs.test_command }}

      - name: Run tests (auto-detect)
        if: ${{ inputs.test_command == '' && inputs.package_manager == 'yarn' }}
        run: |
          if yarn run -T test -v >/dev/null 2>&1; then
            yarn test --run
          else
            echo "No tests configured, skipping"
          fi

      - name: Build package
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm run build
          else
            yarn build
          fi

      - name: Configure git user
        run: |
          git config user.name "fdk-bot"
          git config user.email "fdk-bot@users.noreply.github.com"

      - name: Bump version and create tag
        run: |
          npm version ${{ inputs.version_bump }} -m "ci: release %s"

      - name: Publish to npm
        run: |
          if npm publish --access public; then
            echo "✅ Package published successfully"
          else
            echo "❌ npm publish failed, rolling back git tag"
            git tag -d "v$(node -p "require('./package.json').version")"
            exit 1
          fi

      - name: Push changes and tags
        env:
          BOT_ACCESS_TOKEN: ${{ secrets.BOT_ACCESS_TOKEN }}
        run: |
          if git push "https://x-access-token:${BOT_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main --follow-tags; then
            echo "✅ Changes and tags pushed successfully"
          else
            echo "❌ Failed to push changes to repository"
            exit 1
          fi
