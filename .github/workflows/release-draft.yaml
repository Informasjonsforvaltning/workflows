name: Release Drafter
on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

jobs:
  draft_release:
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          token: ${{ secrets.GH_TOKEN }}
